name: More Settings

on:
  workflow_call:
    inputs:
      source-ref:
        description: Exact source commit for the release pipeline
        type: string
        default: ""
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['more-settings/v*']
    paths:
      - 'more-settings/**'
      - 'shared/**'
      - '.github/workflows/build-more-settings.yml'
      - '.github/workflows/_build-mod.yml'
  pull_request:
    branches: [main]
    paths:
      - 'more-settings/**'
      - 'shared/**'
      - '.github/workflows/build-more-settings.yml'
      - '.github/workflows/_build-mod.yml'

permissions:
  contents: write

concurrency:
  group: build-more-settings-${{ github.workflow }}-${{ github.ref }}-${{ inputs.source-ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.source-ref == '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      - name: Test appearance, ownership and regional presentation filters
        working-directory: more-settings
        run: haxe test.hxml
      - uses: actions/checkout@v4
        with:
          repository: HaxeFoundation/hashlink
          ref: 04a207d73816132b9f742867e8643f58b02a5afa
          path: .combat-hashlink
          persist-credentials: false
      - name: Build the HashLink combat test runtime
        run: make -C .combat-hashlink -j2 hl
      - uses: actions/checkout@v4
        with:
          repository: hlx-framework/hlx-core
          ref: 70800e6e279ca5df2bd2cb45d347c92a3d30e435
          path: .pipeline-hlx
          persist-credentials: false
      - name: Test native pipeline handle return at startup
        working-directory: more-settings
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/more-settings/build/pipeline-return-test:${{ github.workspace }}/.combat-hashlink
        run: |
          mkdir -p build/pipeline-return-test
          cc -std=c11 -fPIC -shared -I ../.combat-hashlink/src tests/native/pipeline_pointer_test.c -L ../.combat-hashlink -lhl -o build/pipeline-return-test/pipeline_pointer_test.hdll
          haxe -cp ../.pipeline-hlx/hlx-runtime/src test-pipeline-return.hxml
          ../.combat-hashlink/hl build/pipeline-return-test/test.hl
      - name: Test damage-number styling on HashLink
        working-directory: more-settings
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.combat-hashlink
        run: |
          mkdir -p build
          haxe -cp src -cp ../shared/src -cp tests/damage-stubs -cp tests -main DamageNumbersTest -hl build/damage-numbers-test.hl
          ../.combat-hashlink/hl build/damage-numbers-test.hl
      - name: Test character locks and 64-bit IDs on HashLink
        working-directory: more-settings
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.combat-hashlink
        run: |
          haxe -D hl-ver=1.16.0 -cp src -cp ../shared/src -cp tests/social-stubs -cp tests/character-lock-stubs -cp tests -main CharacterLocksTest -hl build/character-locks-test.hl
          ../.combat-hashlink/hl build/character-locks-test.hl
      - name: Test appearance isolation and saving on HashLink
        working-directory: more-settings
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.combat-hashlink
        run: |
          haxe -cp src -cp ../shared/src -cp tests/appearance-stubs -cp tests -main AppearanceTest -hl build/appearance-test.hl
          ../.combat-hashlink/hl build/appearance-test.hl
      - name: Test Social settings on HashLink
        working-directory: more-settings
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.combat-hashlink
        run: |
          haxe -cp src -cp ../shared/src -cp tests/social-stubs -cp tests -main SocialTest -hl build/social-test.hl
          ../.combat-hashlink/hl build/social-test.hl
          haxe -cp src -cp ../shared/src -cp tests/social-stubs -cp tests -main SocialInteractTest -hl build/social-interact-test.hl
          ../.combat-hashlink/hl build/social-interact-test.hl
      - name: Test incremental loading and pipeline lifecycle on HashLink
        working-directory: more-settings
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.combat-hashlink
        run: |
          haxe -cp src -cp ../shared/src -cp tests/stall-stubs -cp tests -main StallOptimizationTest -hl build/stall-optimization-test.hl
          ../.combat-hashlink/hl build/stall-optimization-test.hl
      - name: Test combat UI and Barbershop on HashLink
        working-directory: more-settings
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.combat-hashlink
        run: |
          haxe -cp src -cp ../shared/src -cp tests/combat-ui-stubs -cp tests -main CombatUiTest -hl build/combat-ui-test.hl
          ../.combat-hashlink/hl build/combat-ui-test.hl
      - name: Test bounded freeze diagnostics on HashLink
        working-directory: more-settings
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.combat-hashlink
        run: |
          haxe -cp src -cp ../shared/src -cp tests -main FrameMetricsTest -hl build/frame-metrics-test.hl
          ../.combat-hashlink/hl build/frame-metrics-test.hl
      - name: Test background GPU resource cleanup on HashLink
        working-directory: more-settings
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.combat-hashlink
        run: |
          haxe -cp src -cp ../shared/src -cp tests/resource-stubs -cp tests -main ResourceCleanupTest -hl build/resource-cleanup-test.hl
          ../.combat-hashlink/hl build/resource-cleanup-test.hl
      - name: Test native GPU release worker with concurrent GC
        working-directory: more-settings
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/more-settings/build/native-release-test:${{ github.workspace }}/.combat-hashlink
        run: |
          mkdir -p build/native-release-test
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -fPIC -shared -pthread -I ../.combat-hashlink/src tests/native/gpu_release_test.c -L ../.combat-hashlink -lhl -o build/native-release-test/dx12.hdll
          haxe -cp src -cp ../shared/src -cp tests/native-stubs -cp tests -main GpuReleaseNativeTest -dce full -hl build/native-release-test/test.hl
          timeout 20s ../.combat-hashlink/hl build/native-release-test/test.hl

  build:
    needs: test
    uses: ./.github/workflows/_build-mod.yml
    with:
      source-ref: ${{ inputs.source-ref }}
      project: more-settings
      required-settings: true
      module: more-settings
      title: More Settings
