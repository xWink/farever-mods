name: Initialize independent releases

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/initialize-releases.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: initialize-independent-releases
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore historical version tags
        shell: bash
        run: |
          git show '6463de5719a36b0238a01c6939b522bef5c7c168:.migration/farever-mods.bundle' > "$RUNNER_TEMP/farever-mods.bundle"
          echo "776b40de91d19a0ffcf912954214f65fa4e8158e8070a1df0df049271059a987  $RUNNER_TEMP/farever-mods.bundle" | sha256sum --check
          git fetch --no-tags "$RUNNER_TEMP/farever-mods.bundle" 'refs/tags/archive/*:refs/tags/archive/*'
          git push origin 'refs/tags/archive/*:refs/tags/archive/*'

      - name: Tag and start each mod's first release build
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git show-ref --verify --quiet 'refs/tags/better-mod-settings/v1.0.1'; then
            git tag -a 'better-mod-settings/v1.0.1' '42637d09ed8071961f60e7dd6498a86edc02272d' -m 'Better Mod Settings v1.0.1

          First release from xWink/farever-mods. Includes the latest main source imported from xWink/farever-better-mod-settings. The repository migration preserves the mod source, installed folder, and settings filenames.
          Install farever-better-mod-settings.zip with Vortex, or extract it into the Farever game directory.'
          fi
          test "$(git rev-parse 'better-mod-settings/v1.0.1^{}')" = '42637d09ed8071961f60e7dd6498a86edc02272d'
          git push origin 'refs/tags/better-mod-settings/v1.0.1'
          # GITHUB_TOKEN pushes do not trigger push workflows.
          gh workflow run 'build-better-mod-settings.yml' --ref 'better-mod-settings/v1.0.1'
          if ! git show-ref --verify --quiet 'refs/tags/item-utilities/v1.2.2'; then
            git tag -a 'item-utilities/v1.2.2' '42637d09ed8071961f60e7dd6498a86edc02272d' -m 'Item Utilities v1.2.2

          First release from xWink/farever-mods. Includes the latest main source imported from xWink/farever-item-utilities. The repository migration preserves the mod source, installed folder, and settings filenames.
          Install farever-item-utilities.zip with Vortex, or extract it into the Farever game directory.'
          fi
          test "$(git rev-parse 'item-utilities/v1.2.2^{}')" = '42637d09ed8071961f60e7dd6498a86edc02272d'
          git push origin 'refs/tags/item-utilities/v1.2.2'
          # GITHUB_TOKEN pushes do not trigger push workflows.
          gh workflow run 'build-item-utilities.yml' --ref 'item-utilities/v1.2.2'
          if ! git show-ref --verify --quiet 'refs/tags/disable-profanity-filter/v1.1.1'; then
            git tag -a 'disable-profanity-filter/v1.1.1' '42637d09ed8071961f60e7dd6498a86edc02272d' -m 'Disable Profanity Filter v1.1.1

          First release from xWink/farever-mods. Includes the latest main source imported from xWink/farever-disable-profanity-filter. The repository migration preserves the mod source, installed folder, and settings filenames.
          Install farever-disable-profanity-filter.zip with Vortex, or extract it into the Farever game directory.'
          fi
          test "$(git rev-parse 'disable-profanity-filter/v1.1.1^{}')" = '42637d09ed8071961f60e7dd6498a86edc02272d'
          git push origin 'refs/tags/disable-profanity-filter/v1.1.1'
          # GITHUB_TOKEN pushes do not trigger push workflows.
          gh workflow run 'build-disable-profanity-filter.yml' --ref 'disable-profanity-filter/v1.1.1'
          if ! git show-ref --verify --quiet 'refs/tags/mute-on-unfocus/v1.2.1'; then
            git tag -a 'mute-on-unfocus/v1.2.1' '42637d09ed8071961f60e7dd6498a86edc02272d' -m 'Mute on Unfocus v1.2.1

          First release from xWink/farever-mods. Includes the latest main source imported from xWink/farever-mute-on-unfocus. The repository migration preserves the mod source, installed folder, and settings filenames.
          Install farever-mute-on-unfocus.zip with Vortex, or extract it into the Farever game directory.'
          fi
          test "$(git rev-parse 'mute-on-unfocus/v1.2.1^{}')" = '42637d09ed8071961f60e7dd6498a86edc02272d'
          git push origin 'refs/tags/mute-on-unfocus/v1.2.1'
          # GITHUB_TOKEN pushes do not trigger push workflows.
          gh workflow run 'build-mute-on-unfocus.yml' --ref 'mute-on-unfocus/v1.2.1'
          if ! git show-ref --verify --quiet 'refs/tags/fix-target-lock/v1.2.1'; then
            git tag -a 'fix-target-lock/v1.2.1' '42637d09ed8071961f60e7dd6498a86edc02272d' -m 'Fix Target Lock v1.2.1

          First release from xWink/farever-mods. Includes the latest main source imported from xWink/farever-fix-target-lock. The repository migration preserves the mod source, installed folder, and settings filenames.
          Install farever-fix-target-lock.zip with Vortex, or extract it into the Farever game directory.'
          fi
          test "$(git rev-parse 'fix-target-lock/v1.2.1^{}')" = '42637d09ed8071961f60e7dd6498a86edc02272d'
          git push origin 'refs/tags/fix-target-lock/v1.2.1'
          # GITHUB_TOKEN pushes do not trigger push workflows.
          gh workflow run 'build-fix-target-lock.yml' --ref 'fix-target-lock/v1.2.1'
