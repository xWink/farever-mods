name: Item Utilities

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['item-utilities/v*']
    paths:
      - 'item-utilities/**'
      - 'shared/**'
      - '.github/workflows/build-item-utilities.yml'
      - '.github/workflows/_build-mod.yml'
  pull_request:
    branches: [main]
    paths:
      - 'item-utilities/**'
      - 'shared/**'
      - '.github/workflows/build-item-utilities.yml'
      - '.github/workflows/_build-mod.yml'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      - name: Test quick-loot input scope
        working-directory: item-utilities
        run: haxe test.hxml

  build:
    needs: test
    uses: ./.github/workflows/_build-mod.yml
    with:
      project: item-utilities
      module: item-utilities
      title: Item Utilities
      imgui: true
