name: Item Utilities

on:
  workflow_call:
    inputs:
      source-ref:
        description: Exact source commit for the release pipeline
        type: string
        default: ""
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['item-utilities/v*']
    paths:
      - 'item-utilities/**'
      - 'shared/**'
      - '.github/workflows/build-item-utilities.yml'
      - '.github/workflows/_build-mod.yml'
  pull_request:
    branches: [main]
    paths:
      - 'item-utilities/**'
      - 'shared/**'
      - '.github/workflows/build-item-utilities.yml'
      - '.github/workflows/_build-mod.yml'

permissions:
  contents: write

concurrency:
  group: build-item-utilities-${{ github.workflow }}-${{ github.ref }}-${{ inputs.source-ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.source-ref == '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      - name: Test quick-loot, item locks, overlays, and presets
        working-directory: item-utilities
        run: haxe test.hxml
      - uses: actions/checkout@v4
        with:
          repository: HaxeFoundation/hashlink
          ref: 04a207d73816132b9f742867e8643f58b02a5afa
          path: .preset-hashlink
          persist-credentials: false
      - name: Build the HashLink preset test runtime
        run: make -C .preset-hashlink -j2 hl
      - name: Test cross-module skill and appearance preset serialization
        working-directory: item-utilities
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.preset-hashlink
        run: |
          mkdir -p build
          haxe test-appearance-serialization.hxml
          ../.preset-hashlink/hl build/appearance-serialization-host.hl
          haxe test-skill-serialization.hxml
          ../.preset-hashlink/hl build/skill-serialization-host.hl

  build:
    needs: test
    uses: ./.github/workflows/_build-mod.yml
    with:
      source-ref: ${{ inputs.source-ref }}
      project: item-utilities
      required-settings: true
      module: item-utilities
      title: Item Utilities
