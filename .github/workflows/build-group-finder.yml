name: Group Finder

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'group-finder/**'
      - 'trade-and-marketplace/assets/badges/**'
      - 'shared/**'
      - '.github/workflows/build-group-finder.yml'
      - '.github/workflows/_build-mod.yml'
  pull_request:
    branches: [main]
    paths:
      - 'group-finder/**'
      - 'trade-and-marketplace/assets/badges/**'
      - 'shared/**'
      - '.github/workflows/build-group-finder.yml'
      - '.github/workflows/_build-mod.yml'

permissions:
  contents: write

concurrency:
  group: build-group-finder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      - name: Test API integration, requests, and UI
        working-directory: group-finder
        run: haxe test.hxml
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        id: native_cache
        with:
          path: group-finder/build/native/group_finder_desktop.hdll
          key: group-finder-native-win64-v1-${{ hashFiles('group-finder/native/**', 'shared/native/fareverly_account.h', 'shared/native/fareverly_browser.h') }}
      - name: Build Windows login plugin
        if: steps.native_cache.outputs.cache-hit != 'true'
        working-directory: group-finder
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends g++-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64
          bash native/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: group-finder-native-dll
          path: group-finder/build/native/group_finder_desktop.hdll
          if-no-files-found: error
  build:
    needs: [test, native]
    uses: ./.github/workflows/_build-mod.yml
    with:
      project: group-finder
      module: group-finder
      title: Group Finder
      required-settings: true
