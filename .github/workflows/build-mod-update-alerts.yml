name: Mod Update Alerts

on:
  workflow_call:
    inputs:
      source-ref:
        description: Exact source commit for the release pipeline
        type: string
        default: ""
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['mod-update-alerts/v*']
    paths:
      - 'mod-update-alerts/**'
      - '.github/workflows/build-mod-update-alerts.yml'
      - '.github/workflows/_build-mod.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mod-update-alerts/**'
      - '.github/workflows/build-mod-update-alerts.yml'
      - '.github/workflows/_build-mod.yml'

permissions:
  contents: write

concurrency:
  group: build-mod-update-alerts-${{ github.workflow }}-${{ github.ref }}-${{ inputs.source-ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.source-ref == '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      - name: Test update detection and reminder persistence
        working-directory: mod-update-alerts
        run: haxe test.hxml

  build:
    needs: test
    uses: ./.github/workflows/_build-mod.yml
    with:
      source-ref: ${{ inputs.source-ref }}
      project: mod-update-alerts
      module: mod-update-alerts
      title: Mod Update Alerts
