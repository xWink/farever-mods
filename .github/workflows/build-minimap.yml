name: Minimap

on:
  workflow_call:
    inputs:
      source-ref:
        description: Exact source commit for the release pipeline
        type: string
        default: ""
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['minimap/v*']
    paths:
      - 'minimap/**'
      - 'shared/**'
      - '.github/workflows/build-minimap.yml'
      - '.github/workflows/_build-mod.yml'
  pull_request:
    branches: [main]
    paths:
      - 'minimap/**'
      - 'shared/**'
      - '.github/workflows/build-minimap.yml'
      - '.github/workflows/_build-mod.yml'

permissions:
  contents: write

concurrency:
  group: build-minimap-${{ github.workflow }}-${{ github.ref }}-${{ inputs.source-ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.source-ref == '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      - name: Test markers, shared map filters, lifecycle, and positioning
        working-directory: minimap
        run: haxe test.hxml
      - uses: actions/checkout@v4
        with:
          repository: HaxeFoundation/hashlink
          ref: 04a207d73816132b9f742867e8643f58b02a5afa
          path: .minimap-hashlink
          persist-credentials: false
      - name: Build the HashLink test runtime
        run: make -C .minimap-hashlink -j2 hl
      - uses: actions/checkout@v4
        with:
          repository: hlx-framework/hlx-core
          ref: 70800e6e279ca5df2bd2cb45d347c92a3d30e435
          path: .minimap-hlx
          persist-credentials: false
      - name: Test production numeric reads on HashLink
        working-directory: minimap
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.minimap-hashlink
        run: |
          mkdir -p build
          haxe -cp tests -cp src -cp ../.minimap-hlx/hlx-runtime/src -main GameAccessNumberTest -dce full -hl build/game-access-number-test.hl
          ../.minimap-hashlink/hl build/game-access-number-test.hl
      - name: Test big-map integration on HashLink
        working-directory: minimap
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.minimap-hashlink
        run: |
          mkdir -p build
          haxe -cp src -cp tests -cp tests/big-map-stubs -main BigMapTest -hl build/big-map-test.hl
          ../.minimap-hashlink/hl build/big-map-test.hl
          haxe -cp src -cp tests -cp tests/big-map-stubs -main MainMapPerformanceTest -hl build/main-map-performance-test.hl
          ../.minimap-hashlink/hl build/main-map-performance-test.hl
          haxe -cp src -cp tests -cp tests/big-map-stubs -main MainMapControlsTest -hl build/main-map-controls-test.hl
          ../.minimap-hashlink/hl build/main-map-controls-test.hl
          haxe -cp src -cp tests -cp tests/big-map-stubs -main MapRefinementsTest -hl build/map-refinements-test.hl
          ../.minimap-hashlink/hl build/map-refinements-test.hl
          haxe -cp src -cp tests -cp tests/big-map-stubs -main SharedMapFiltersTest -hl build/shared-map-filters-test.hl
          ../.minimap-hashlink/hl build/shared-map-filters-test.hl
          haxe -cp src -cp tests -cp tests/big-map-stubs -main MinimapFilterPanelTest -hl build/minimap-filter-panel-test.hl
          ../.minimap-hashlink/hl build/minimap-filter-panel-test.hl
          haxe -cp src -cp tests -cp tests/big-map-stubs -main MapChangesTest -hl build/map-changes-test.hl
          ../.minimap-hashlink/hl build/map-changes-test.hl
          haxe -cp src -cp tests -cp tests/big-map-stubs -main WorldChestMarkersTest -hl build/world-chest-markers-test.hl
          ../.minimap-hashlink/hl build/world-chest-markers-test.hl

  build:
    needs: test
    uses: ./.github/workflows/_build-mod.yml
    with:
      source-ref: ${{ inputs.source-ref }}
      project: minimap
      required-settings: true
      module: minimap
      title: Minimap
