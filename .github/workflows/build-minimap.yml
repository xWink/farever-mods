name: Minimap

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['minimap/v*']
    paths:
      - 'minimap/**'
      - '.github/workflows/build-minimap.yml'
      - '.github/workflows/_build-mod.yml'
  pull_request:
    branches: [main]
    paths:
      - 'minimap/**'
      - '.github/workflows/build-minimap.yml'
      - '.github/workflows/_build-mod.yml'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      - name: Test activity visibility and dungeon classification
        working-directory: minimap
        run: haxe test.hxml

  build:
    needs: test
    uses: ./.github/workflows/_build-mod.yml
    with:
      project: minimap
      module: minimap
      title: Minimap
