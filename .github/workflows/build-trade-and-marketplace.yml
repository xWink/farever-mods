name: Trade and Marketplace

on:
  workflow_call:
    inputs:
      source-ref:
        description: Exact source commit for the release pipeline
        type: string
        default: ""
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trade-and-marketplace/**'
      - 'shared/**'
      - '.github/workflows/build-trade-and-marketplace.yml'
      - '.github/workflows/_build-mod.yml'
  pull_request:
    branches: [main]
    paths:
      - 'trade-and-marketplace/**'
      - 'shared/**'
      - '.github/workflows/build-trade-and-marketplace.yml'
      - '.github/workflows/_build-mod.yml'

permissions:
  contents: write
  actions: read # Only the Marketplace native cache/bootstrap needs this.

concurrency:
  group: build-trade-and-marketplace-${{ github.workflow }}-${{ github.ref }}-${{ inputs.source-ref }}
  cancel-in-progress: ${{ inputs.source-ref == '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      - name: Test protocol, controller, inventory and exchange safeguards
        working-directory: trade-and-marketplace
        run: haxe test.hxml
      - uses: actions/checkout@v4
        with:
          repository: HaxeFoundation/hashlink
          ref: 04a207d73816132b9f742867e8643f58b02a5afa
          path: .trade-oracle-hashlink
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build isolated bytecode comparison harness
        run: |
          pip install crashlink==0.0.9
          python trade-and-marketplace/recovery/tools/patch_oracle_runtime.py .trade-oracle-hashlink
          make -C .trade-oracle-hashlink -j2 hl
      - name: Compare with surviving original bytecode
        working-directory: trade-and-marketplace
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.trade-oracle-hashlink
        run: |
          mkdir -p build
          unzip -p recovery/reference.zip hlx/mods/trade/implementation/trade.hl > build/reference.hl
          python recovery/tools/make_oracle.py build/reference.hl build/original-oracle.hl
          haxe -cp src -cp tests -main OracleTest -hl build/oracle-test.hl
          ../.trade-oracle-hashlink/hl build/original-oracle.hl
      - name: Exercise marketplace exports, rendering and recovery in HashLink
        working-directory: trade-and-marketplace
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.trade-oracle-hashlink
        run: |
          haxe -cp src -cp tests -cp tests/controller-stubs -main PartyTest -hl build/party-test.hl
          ../.trade-oracle-hashlink/hl build/party-test.hl
          haxe -cp src -cp tests -cp tests/chat-stubs -main ChatTest -hl build/chat-test.hl
          ../.trade-oracle-hashlink/hl build/chat-test.hl
          haxe -cp src -cp ../shared/src -cp tests -cp tests/market-stubs -main MarketplaceTest -hl build/marketplace-test.hl
          ../.trade-oracle-hashlink/hl build/marketplace-test.hl
          haxe -cp src -cp ../shared/src -cp tests -cp tests/market-stubs -cp tests/market-ui-stubs -resource assets/cart.png@trade-and-marketplace/cart.png -main MarketplaceUiTest -hl build/marketplace-ui-test.hl
          ../.trade-oracle-hashlink/hl build/marketplace-ui-test.hl
          haxe -cp src -cp ../shared/src -cp tests -cp tests/market-stubs -cp tests/market-state-stubs -main MarketplaceStateTest -hl build/marketplace-state-test.hl
          ../.trade-oracle-hashlink/hl build/marketplace-state-test.hl
          haxe -cp src -cp tests -main MarketplaceTimeTest -hl build/marketplace-time-test.hl
          for timezone in UTC "PST8PDT,M3.2.0/2,M11.1.0/2" Asia/Kathmandu; do
            TZ="$timezone" ../.trade-oracle-hashlink/hl build/marketplace-time-test.hl
          done

  native:
    name: Native desktop plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}

      # Only native/desktop.cpp, build.sh and their actual local includes
      # can change the DLL. Haxe UI changes cannot invalidate this cache.
      - name: Restore cached Windows desktop plugin
        id: native_cache
        uses: actions/cache/restore@v4
        with:
          path: trade-and-marketplace/build/native/trade_marketplace_desktop.hdll
          key: marketplace-native-win64-gcc13-v1-${{ hashFiles('trade-and-marketplace/native/desktop.cpp', 'trade-and-marketplace/native/build.sh', 'shared/native/fareverly_account.h', 'shared/native/fareverly_browser.h') }}

      # Seed the FIRST build without MinGW using the exact verified DLL from
      # completed run 39854536435. Reuse it only if ALL four input files match
      # the versions from that successful build, byte-for-byte.
      - name: Check verified native artifact compatibility
        id: native_source
        if: steps.native_cache.outputs.cache-hit != 'true'
        run: |
          if [[ "$(git hash-object trade-and-marketplace/native/desktop.cpp)" == "e7857d96d484d553f9cc4a24738b950630d80366" &&
                "$(git hash-object trade-and-marketplace/native/build.sh)" == "a5245700c884f849f81a10036d7b42afb944f43b" &&
                "$(git hash-object shared/native/fareverly_account.h)" == "b30cd5852b0883e29203cd59ea9124ad5d7a52cd" &&
                "$(git hash-object shared/native/fareverly_browser.h)" == "dc2afd3984615cc6de4c7cabd967188f01439023" ]]; then
            echo "compatible=true" >> "$GITHUB_OUTPUT"
          else
            echo "compatible=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download verified native DLL
        id: seed_download
        if: steps.native_cache.outputs.cache-hit != 'true' && steps.native_source.outputs.compatible == 'true'
        continue-on-error: true # An expired artifact falls back to compilation.
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39854536435
          github-token: ${{ github.token }}
          name: farever-trade-and-marketplace
          path: trade-and-marketplace/build/native/verified

      - name: Reuse verified native DLL
        id: seed_reuse
        if: steps.seed_download.outcome == 'success'
        run: |
          src=trade-and-marketplace/build/native/verified/hlx/plugins/trade-and-marketplace/trade_marketplace_desktop.hdll
          dest=trade-and-marketplace/build/native/trade_marketplace_desktop.hdll
          if [[ -s "$src" ]] && echo "7fb174b45feb20bf5627c7049d3213ac33f0cefd19cdf5aa35a7fa4578e92f2b  $src" | sha256sum --check --status; then
            cp "$src" "$dest"
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "Reused SHA-256 verified Windows DLL, without MinGW installation."
          else
            echo "::warning::Verified DLL unavailable or hash mismatch; building native source."
          fi

      - name: Build desktop plugin when native source changes
        if: steps.native_cache.outputs.cache-hit != 'true' && steps.seed_reuse.outputs.reused != 'true'
        working-directory: trade-and-marketplace
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          # No need to download both POSIX and Win32 compiler variants.
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends g++-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64
          bash native/build.sh

      - name: Verify Windows DLL and native exports
        run: |
          dll=trade-and-marketplace/build/native/trade_marketplace_desktop.hdll
          test -s "$dll"
          file "$dll" | grep -Eq 'PE32[+] executable.*x86-64'
          for symbol in hlp_secure_random hlp_write_credential hlp_open_url; do
            grep -aFq "$symbol" "$dll" || { echo "::error::Missing exported native primitive $symbol"; exit 1; }
          done

      - name: Save native DLL to source-keyed cache
        if: steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: trade-and-marketplace/build/native/trade_marketplace_desktop.hdll
          key: marketplace-native-win64-gcc13-v1-${{ hashFiles('trade-and-marketplace/native/desktop.cpp', 'trade-and-marketplace/native/build.sh', 'shared/native/fareverly_account.h', 'shared/native/fareverly_browser.h') }}

      - name: Upload native DLL for this workflow's package job
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-native-dll
          path: trade-and-marketplace/build/native/trade_marketplace_desktop.hdll
          if-no-files-found: error
          compression-level: 0

  build:
    needs: [test, native]
    uses: ./.github/workflows/_build-mod.yml
    with:
      source-ref: ${{ inputs.source-ref }}
      project: trade-and-marketplace
      module: trade-and-marketplace
      artifact-name: farever-trade-and-marketplace
      title: Trade and Marketplace
      required-settings: true
