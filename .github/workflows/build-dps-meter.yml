name: DPS Meter

on:
  workflow_call:
    inputs:
      mod-version:
        description: Release version embedded in combat logs
        type: string
        default: ""
      source-ref:
        description: Exact source commit for the release pipeline
        type: string
        default: ""
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['dps-meter/v*']
    paths:
      - 'dps-meter/**'
      - 'shared/**'
      - '.github/workflows/build-dps-meter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dps-meter/**'
      - 'shared/**'
      - '.github/workflows/build-dps-meter.yml'

permissions:
  contents: read
  actions: read # Used only to seed the pinned Windows native DLL from a verified run.

concurrency:
  group: build-dps-meter-${{ github.workflow }}-${{ github.ref }}-${{ inputs.source-ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.source-ref == '' }}

jobs:
  native:
    name: Windows desktop plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}

      # No Haxe source influences this DLL. Key every local native input,
      # including both layers of included headers, so UI edits skip MinGW.
      - name: Restore cached desktop plugin
        id: native_cache
        uses: actions/cache/restore@v4
        with:
          path: dps-meter/build/native/dps_meter_desktop.hdll
          key: dps-native-win64-mingw-posix13-v1-${{ hashFiles('dps-meter/native/desktop.cpp', 'dps-meter/native/build.sh', 'dps-meter/native/image_buffer.h', 'dps-meter/native/ready_audio.h', 'dps-meter/native/fareverly_account.h', 'dps-meter/native/fareverly_browser.h', 'shared/native/fareverly_account.h', 'shared/native/fareverly_browser.h') }}

      # Bootstrap a cold cache without downloading the Windows toolchain.
      # The successful run 39895163698 compiled this exact native source and
      # passed its Windows audio, clipboard and Recycle Bin integration tests.
      # Native changes bypass this shortcut and rebuild.
      - name: Check audited native source compatibility
        id: seed_sources
        if: steps.native_cache.outputs.cache-hit != 'true'
        run: |
          if [[ "$(git hash-object dps-meter/native/desktop.cpp)" == "f5d1aec3516964aaf361558df82957615f6ac43e" &&
                "$(git hash-object dps-meter/native/build.sh)" == "5b9e38cc5b1c4ed130e58e9b1d4c2294e43a19c8" &&
                "$(git hash-object dps-meter/native/image_buffer.h)" == "b0c40976b54d1ea80da70ce4d0670bbbbc841bf9" &&
                "$(git hash-object dps-meter/native/ready_audio.h)" == "9643b40c96462b6dbef2de06592524b57747044a" &&
                "$(git hash-object dps-meter/native/fareverly_account.h)" == "c6d5e421c9d2de76113c67fbef513b9ec26c1c2e" &&
                "$(git hash-object dps-meter/native/fareverly_browser.h)" == "48be4b134fc359a4f9d801c6ad452ba3dc49fe25" &&
                "$(git hash-object shared/native/fareverly_account.h)" == "b30cd5852b0883e29203cd59ea9124ad5d7a52cd" &&
                "$(git hash-object shared/native/fareverly_browser.h)" == "dc2afd3984615cc6de4c7cabd967188f01439023" ]]; then
            echo "compatible=true" >> "$GITHUB_OUTPUT"
          else
            echo "compatible=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download audited DPS Meter native DLL
        id: seed_download
        if: steps.native_cache.outputs.cache-hit != 'true' && steps.seed_sources.outputs.compatible == 'true'
        uses: actions/download-artifact@v4
        continue-on-error: true # An expired prior run triggers a fresh build.
        with:
          name: farever-dps-meter
          run-id: 39895163698
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: dps-meter/build/native/audited

      - name: Reuse audited DPS Meter native DLL
        id: seed_reuse
        if: steps.seed_download.outcome == 'success'
        run: |
          src=dps-meter/build/native/audited/hlx/plugins/dps-meter/dps_meter_desktop.hdll
          dst=dps-meter/build/native/dps_meter_desktop.hdll
          if [[ -s "$src" ]] && echo "e9506e8e6ff7a50770e4ea9f9d4a7820687bca580951b90820851f04b01c6b13  $src" | sha256sum --check --status; then
            cp "$src" "$dst"
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "Reused SHA-256 audited DLL from passing build 39895163698."
          else
            echo "::warning::Audited DLL missing or SHA-256 mismatch; compiling from source."
          fi

      - name: Compile native DLL if sources changed
        if: steps.native_cache.outputs.cache-hit != 'true' && steps.seed_reuse.outputs.reused != 'true'
        working-directory: dps-meter
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends g++-mingw-w64-x86-64-posix
          bash native/build.sh

      - name: Validate Windows DLL and primitive exports
        run: |
          dll=dps-meter/build/native/dps_meter_desktop.hdll
          test -s "$dll"
          file "$dll" | grep -Eq 'PE32[+] executable.*x86-64'
          for primitive in hlp_open_folder hlp_recycle_file hlp_copy_image \
            hlp_prepare_audio hlp_play_audio hlp_update_audio hlp_stop_audio \
            hlp_dispose_audio hlp_secure_random hlp_write_credential hlp_open_url; do
            grep -aFq "$primitive" "$dll" || { echo "::error::Missing native export $primitive"; exit 1; }
          done
          echo "Validated native DLL and exported primitives."

      - name: Cache native DLL by native source hash
        if: steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dps-meter/build/native/dps_meter_desktop.hdll
          key: dps-native-win64-mingw-posix13-v1-${{ hashFiles('dps-meter/native/desktop.cpp', 'dps-meter/native/build.sh', 'dps-meter/native/image_buffer.h', 'dps-meter/native/ready_audio.h', 'dps-meter/native/fareverly_account.h', 'dps-meter/native/fareverly_browser.h', 'shared/native/fareverly_account.h', 'shared/native/fareverly_browser.h') }}

      - name: Upload native DLL for DPS Meter packaging
        uses: actions/upload-artifact@v4
        with:
          name: dps-meter-native-dll
          path: dps-meter/build/native/dps_meter_desktop.hdll
          if-no-files-found: error
          compression-level: 0

  build:
    needs: [native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dps-meter
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^dps-meter/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Expected dps-meter/vX.Y.Z' >&2
            exit 1
          fi
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      - name: Install HLX runtime
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"
          haxelib git hlx-runtime https://github.com/hlx-framework/hlx-core.git main hlx-runtime/src
      - name: Test required dependency checks
        working-directory: shared
        run: haxe test-dependencies.hxml
      - name: Set combat log build version
        env:
          RELEASE_VERSION: ${{ inputs.mod-version }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            echo "DPS_METER_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF_NAME" == dps-meter/v* ]]; then
            echo "DPS_METER_VERSION=${GITHUB_REF_NAME#dps-meter/v}" >> "$GITHUB_ENV"
          else
            echo "DPS_METER_VERSION=dev+$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
          fi
      - name: Compile HLX mod
        run: haxe compile.hxml
      - name: Test fight history and combat boundaries
        run: haxe test.hxml
      - uses: actions/checkout@v4
        with:
          repository: HaxeFoundation/hashlink
          ref: 04a207d73816132b9f742867e8643f58b02a5afa
          path: .audio-hashlink
          persist-credentials: false
      - name: Test audio buffers and equipped weapon logs on HashLink
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.audio-hashlink
        run: |
          make -C ../.audio-hashlink -j2 hl
          haxe test-ready-audio-hl.hxml
          ../.audio-hashlink/hl build/ready-audio-test.hl
          haxe -cp src -cp ../shared/src -cp tests -main EquippedWeaponsTest -dce full -hl build/equipped-weapons-test.hl
          ../.audio-hashlink/hl build/equipped-weapons-test.hl
      - name: Download native DLL from parallel job
        uses: actions/download-artifact@v4
        with:
          name: dps-meter-native-dll
          path: dps-meter/build/native
      - name: Test snapshot pixel buffers
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/image_buffer_test.cpp -o build/native/image-buffer-test
          build/native/image-buffer-test
      - name: Package HLX mod
        run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: farever-dps-meter
          path: dps-meter/package/
          if-no-files-found: error

  windows-desktop:
    needs: [build]
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: farever-dps-meter
          path: package
      - name: Verify Windows audio, clipboard, and recoverable deletion
        shell: pwsh
        run: ./dps-meter/tests/desktop_windows_test.ps1 -Plugin ./package/hlx/plugins/dps-meter/dps_meter_desktop.hdll

  release:
    needs: [build, windows-desktop]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/dps-meter/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: farever-dps-meter
          path: package
      - name: Create installation archive
        working-directory: package
        run: zip -r ../farever-dps-meter.zip hlx
      - name: Publish release
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          release_options=()
          if [[ "${GITHUB_REF_NAME#dps-meter/v}" == *-* ]]; then
            release_options+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" farever-dps-meter.zip \
            --verify-tag --title "DPS Meter ${GITHUB_REF_NAME#*/}" \
            --notes-from-tag --latest=false "${release_options[@]}"
